<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cultivos - Invernadero</title>
    <style>
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: #ffffff00; 
            background-image: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url('https://images.pexels.com/photos/580900/pexels-photo-580900.jpeg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            width: 100%;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .barra-verde {
            background-color: #a0cc5ab6;
            height: 60px;
            display: flex;
            justify-content: space-between; 
            align-items: center;
            padding: 0 20px;
            border-bottom: 1px solid #a0cc5a;
        }

        .titulo-header {
            font-size: 24px;
            font-weight: bold;
            color: #333;
        }

        /* Pestañas de Navegación */
        .tablas {
            display: flex;
            height: 100%;
        }

        .tablas a {
            text-decoration: none;
            color: #333;
            padding: 0 20px;
            display: flex;
            align-items: center;
            font-size: 16px;
            border-left: 1px solid #00000000;
            border-right: 1px solid #00000000;
            transition: background-color 0.2s;
            cursor: pointer;
        }

        .tablas a:hover {
            background-color: #ffffff40;
        }

        .tablas a.active {
            background-color: #ffffff;
            font-weight: bold;
        }

        /* Botón de cierre de sesión */
        .btn-titulo {
            background-color: #f7e27e; 
            border: 1px solid #d4b63e;
            padding: 8px 15px;
            font-size: 14px;
            cursor: pointer;
            text-transform: uppercase;
            font-weight: bold;
            color: #333;
            text-decoration: none;
        }

        .btn-titulo:hover {
            background-color: #e0c95a;
        }

        /* --- CONTENIDO PRINCIPAL --- */
        .contenedor-principal {
            flex: 1;
            padding: 40px;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        /* --- ESTILOS DE LA VISTA DE TABLA --- */
        .vista-tabla {
            background-color: rgba(255, 255, 255, 0.9); 
            padding: 20px;
            border-radius: 4px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            width: 100%;
        }

        .barra-herramientas {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            align-items: center;
        }

        .btn-accion {
            background-color: #e6e6e6c7;
            border: 1px solid #adadadc5;
            padding: 10px 15px;
            font-size: 20px;
            cursor: pointer;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-accion:hover { background-color: #d4d4d4bb; }

        .barra-busqueda {
            flex: 1;
            padding: 10px;
            border: 1px solid #adadadc5;
            border-radius: 4px;
            background-color: #e6e6e6c7;
            font-size: 14px;
        }

        /* Estructura de la tabla */
        .tabla-header {
            display: flex;
            background-color: #e6e6e6c7;
            padding: 15px;
            font-weight: bold;
            border: 1px solid #adadadc5;
            border-radius: 4px;
            margin-bottom: 5px;
        }

        .tabla-cuerpo {
            background-color: #e6e6e6c7;
            min-height: 400px; 
            border: 1px solid #adadadc5;
            border-radius: 4px;
            padding: 15px;
        }

        /* Columnas */
        .col-nombre { flex: 2; text-align: center; }
        .col-tipo { flex: 1; text-align: center; }
        .col-fecha { flex: 1; text-align: center; }
        .col-estacional { flex: 1; text-align: center; }

    </style>
</head>
<body>

    <!-- HEADER -->
    <header>
        <div class="barra-verde">
            <div class="titulo-header">Invernadero</div>

            <nav class="tablas">
                <!-- Enlace a inicio (admin.html) -->
                <a href="admin.html">Inicio</a>
                <!-- Enlace a esta misma página (activo) -->
                <a href="cultivos.html" class="active">Cultivos</a>
                <!-- Enlace a sensores -->
                <a href="sensores.html">Sensores</a>
            </nav>

            <a href="main.html" class="btn-titulo">Cierre de sesión</a>
        </div>
    </header>

    <!-- CONTENEDOR PRINCIPAL -->
    <main class="contenedor-principal">
        <section class="vista-tabla">
            <!-- Barra de herramientas -->
            <div class="barra-herramientas">
                <button class="btn-accion">+</button>
                <input type="text" class="barra-busqueda" placeholder="Buscar...">
                <button class="btn-accion">▼</button>
            </div>

            <!-- Encabezados de la tabla (CON Es estacional) -->
            <div class="tabla-header">
                <div class="col-nombre">Nombre</div>
                <div class="col-tipo">Tipo</div>
                <div class="col-fecha">Fecha</div>
                <div class="col-estacional">Es estacional</div>
            </div>

            <!-- Cuerpo de la tabla -->
            <div class="tabla-cuerpo">
                <!-- Aquí irían las filas de datos -->
            </div>
        </section>
    </main>

</body>
</html>
